<div class="container-site py-6 sm:py-10">
  <nav aria-label="Breadcrumb" class="text-sm text-neutral-500">
    <ol class="flex flex-wrap items-center gap-1">
      <li><a href="/" class="hover:text-brand-600">Home</a></li>
      <li aria-hidden="true">›</li>
      <li aria-current="page">{{title}}</li>
    </ol>
  </nav>

  <article class="mx-auto mt-6 max-w-3xl">
    <header>
      <h1 class="text-3xl font-black tracking-tight sm:text-4xl">{{title}}</h1>
      <p class="mt-3 text-lg text-neutral-600 dark:text-neutral-400">{{description}}</p>
      <p class="mt-2 text-sm text-neutral-500">Last updated <time datetime="{{dateIso}}">{{dateHuman}}</time></p>
    </header>
    <div class="prose prose-neutral mt-8 dark:prose-invert prose-headings:font-extrabold prose-headings:tracking-tight">
      {{body}}
    </div>
  </article>
</div>
